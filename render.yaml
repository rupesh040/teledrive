# Free preview: SQLite account settings and file metadata reset on service restarts.
# Files already uploaded to Telegram remain in Telegram.
services:
  - type: web
    name: teledrive
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /tmp/teledrive.db
      - key: WEB_DIST_PATH
        value: /app/web/dist
      - key: EPHEMERAL_STORAGE
        value: "true"
