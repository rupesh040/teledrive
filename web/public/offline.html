<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fdf7ff" />
    <title>TeleDrive · Offline</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; color: #1d1b20; background: #fdf7ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 420px; padding: 32px; border-radius: 28px; background: #fff; }
      svg { color: #65558f; }
      h1 { margin: 20px 0 12px; font-size: 28px; line-height: 1.25; font-weight: 500; }
      p { margin: 0 0 24px; color: #49454f; }
      a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #65558f; color: #fff; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #65558f; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        :root { color: #e6e0e9; background: #141218; }
        main { background: #211f26; }
        p { color: #cac4d0; }
        svg { color: #cfbdfe; }
        a { color: #36275d; background: #cfbdfe; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="48" height="48" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M9 24a7 7 0 0 1-1.2-13.9A9 9 0 0 1 25 9.5 7.3 7.3 0 0 1 24 24H9Z" /></svg>
      <h1>You’re offline</h1>
      <p>Reconnect to open your drive. Your Telegram account and files are not stored in the offline cache.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
