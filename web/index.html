<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the saved appearance before styles paint, including System mode.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("td-theme");
          if (["light", "dark", "system"].includes(saved)) preference = saved;
        } catch {}
        const mode =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = mode;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <title>TeleDrive</title>
    <meta name="theme-color" content="#fdf7ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeleDrive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="TeleDrive" />
    <meta
      name="description"
      content="A little space for everything. Your personal cloud, powered by Telegram."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
